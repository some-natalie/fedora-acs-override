name: 🔍 Malcontent differential analysis 🔍

on:
  pull_request:
    branches: ["main"]
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

permissions:
  contents: read

jobs:
  extract-action-repo:
    name: Get repo name from the changed Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.action-info.outputs.changed }}
      old_action_org: ${{ steps.action-info.outputs.old_action_org }}
      new_action_org: ${{ steps.action-info.outputs.new_action_org }}
      old_action_repo: ${{ steps.action-info.outputs.old_action_repo }}
      new_action_repo: ${{ steps.action-info.outputs.new_action_repo }}
      old_action_dir: ${{ steps.action-info.outputs.old_action_dir }}
      new_action_dir: ${{ steps.action-info.outputs.new_action_dir }}
      old_ref: ${{ steps.action-info.outputs.old_ref }}
      new_ref: ${{ steps.action-info.outputs.new_ref }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse the Action repo and refs out of the PR diff
        id: action-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/parse-action-diff.sh

  malcontent:
    name: Malware analysis using malcontent
    needs: extract-action-repo
    if: needs.extract-action-repo.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push the built Action images for malcontent to diff
    steps:
      # first, so the later path-scoped checkouts survive this one's clean
      - name: Checkout this repo for its scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # look at prior state
      - name: Checkout original code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.extract-action-repo.outputs.old_action_org }}/${{ needs.extract-action-repo.outputs.old_action_repo }}
          ref: ${{ needs.extract-action-repo.outputs.old_ref }}
          path: "prior-commit"
          persist-credentials: false

      - name: Setup original code
        env:
          SIDE: OLD
          REPO: ${{ github.repository }}
          CHECKOUT: prior-commit
          ACTION_DIR: ${{ needs.extract-action-repo.outputs.old_action_dir }}
        run: .github/scripts/setup-action-code.sh

      # look at current commit
      - name: Checkout the current code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.extract-action-repo.outputs.new_action_org }}/${{ needs.extract-action-repo.outputs.new_action_repo }}
          ref: ${{ needs.extract-action-repo.outputs.new_ref }}
          path: "current-commit"
          persist-credentials: false

      - name: Setup new code
        env:
          SIDE: NEW
          REPO: ${{ github.repository }}
          CHECKOUT: current-commit
          ACTION_DIR: ${{ needs.extract-action-repo.outputs.new_action_dir }}
        run: .github/scripts/setup-action-code.sh

      - name: Analyze the files
        run: .github/scripts/malcontent-diff.sh

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: malcontent-results.md
          name: malcontent-results

  comment:
    name: Comment on the PR
    runs-on: ubuntu-latest
    needs: malcontent
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout this repo for its scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malcontent-results
          path: .

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/comment-malcontent-results.sh
